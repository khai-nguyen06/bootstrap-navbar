<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Bootstrap Navbar</title>
    <!-- Nhúng Bootstrap CSS qua CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

    <!-- THANH ĐIỀU HƯỚNG NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <!-- Logo / Tên thương hiệu -->
            <a class="navbar-brand" href="#">MyWebsite</a>
            
            <!-- Nút Toggler mở menu trên màn hình di động -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Danh sách menu điều hướng -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <!-- Dropdown Menu -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Services
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Web Design</a></li>
                            <li><a class="dropdown-item" href="#">SEO</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Marketing</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- NỘI DUNG MÔ TẢ TRANG -->
    <div class="container mt-5">
        <div class="p-5 mb-4 bg-light rounded-3 shadow-sm">
            <h1 class="display-6 fw-bold">Thực Hành Bootstrap 5 Navbar</h1>
            <p class="col-md-8 fs-5 text-secondary">
                Thanh điều hướng được xây dựng hoàn chỉnh với Bootstrap 5, hỗ trợ Dropdown tương tác và tự động thu gọn thành nút hamburger trên thiết bị di động (Mobile).
            </p>
        </div>
    </div>

    <!-- Nhúng Bootstrap Bundle JS (Bao gồm Popper) để Dropdown và Toggler hoạt động -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
